spring:
  application:
    name: t-solve
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tsolve}
    username: ${DB_USER:tsolve}
    password: ${DB_PASSWORD:tsolve}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tsolve:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
